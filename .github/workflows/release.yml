name: build-release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow

      - name: Generate icon
        run: python tools/make_icon.py

      - name: Build exe
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed `
            --name StickyNotes `
            --icon assets/note.ico `
            --add-data "assets/note.ico;." `
            src/sticky.py

      - name: Package zip
        run: python tools/package.py v1.0.0

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: 轻便签 v1.0.0
          body_path: RELEASE_NOTES.md
          files: release/*.zip
          allowUpdates: true
          draft: false
          prerelease: false
